
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Photo Submission</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  font-family:Arial,sans-serif;
  background:#f1f5f9;color:#1e293b;
}
.container{
  max-width:480px;margin:30px auto;
  background:white;padding:22px;
  border-radius:20px;text-align:center;
  box-shadow:0 5px 25px #0001;
}
h2{margin-top:0}
video,img{
  width:100%;border-radius:14px;
  background:#111;display:block;
}
img{display:none}
button{
  width:100%;padding:15px;margin-top:12px;
  border:0;border-radius:12px;
  font-size:16px;font-weight:bold;
  background:#2563eb;color:white;
}
button.secondary{background:#64748b}
#status{font-size:14px;color:#64748b;margin:15px 0}
</style>
</head>
<body>
<div class="container">
  <h2>ส่งภาพกิจกรรม</h2>
  <p>ถ่ายภาพเพื่อส่งงาน</p>

  <video id="camera" autoplay muted playsinline></video>

  <button id="switchCamera" class="secondary">
  🔄 สลับกล้องหน้า / กล้องหลัง
  </button>
  
  <img id="preview" alt="ตัวอย่างภาพ">

  <div id="status">กำลังเตรียมกล้อง...</div>

  <button id="capture">ถ่ายภาพ</button>
  <button id="retake" class="secondary" hidden>ถ่ายใหม่</button>
  <button id="upload" hidden>ส่งภาพ</button>
</div>

<canvas id="canvas" hidden></canvas>

<script>
const video = document.getElementById('camera');
const preview = document.getElementById('preview');
const canvas = document.getElementById('canvas');
const statusText = document.getElementById('status');

let photoData = '';
let cameraStream = null;
let cameraMode = 'environment';

async function startCamera(){

  try {

    // ปิดกล้องเดิมก่อนสลับ
    if(cameraStream){
      cameraStream.getTracks().forEach(track => track.stop());
    }

    statusText.textContent = 'กำลังเปลี่ยนกล้อง...';

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: cameraMode }
      },
      audio: false
    });

    video.srcObject = cameraStream;

    await video.play();

    statusText.textContent =
      cameraMode === 'environment'
      ? 'กำลังใช้กล้องหลัง'
      : 'กำลังใช้กล้องหน้า';

  } catch(error) {

    statusText.textContent =
      'เปิดกล้องไม่สำเร็จ: ' + error.name;

  }
}

document.getElementById('capture').onclick = ()=>{
  if(!video.videoWidth){
    statusText.textContent = 'กล้องยังไม่พร้อม';
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(
    video,0,0,canvas.width,canvas.height
  );

  photoData = canvas.toDataURL('image/jpeg',0.75);
  preview.src = photoData;
  preview.style.display = 'block';
  video.style.display = 'none';

  document.getElementById('capture').hidden = true;
  document.getElementById('retake').hidden = false;
  document.getElementById('upload').hidden = false;
  document.getElementById('switchCamera').hidden = true;
  statusText.textContent = 'ตรวจสอบภาพก่อนส่ง';
};

document.getElementById('retake').onclick = ()=>{
  preview.style.display = 'none';
  video.style.display = 'block';
  photoData = '';

  document.getElementById('capture').hidden = false;
  document.getElementById('retake').hidden = true;
  document.getElementById('upload').hidden = true;
  document.getElementById('switchCamera').hidden = false;
  statusText.textContent = 'พร้อมถ่ายภาพ';
};

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbw0ydRXNx4gC6arYSOykMlcOmGKJ6uHIm9JlLzY4TCCxCVrKv0zUosAvuAKLWPw8WHa/exec';

document.getElementById('upload').onclick = async ()=>{
  if(!photoData) {
    statusText.textContent = 'ไม่พบภาพ กรุณาถ่ายภาพใหม่';
    return;
  }

  const uploadButton = document.getElementById('upload');

  uploadButton.disabled = true;
  uploadButton.textContent = 'กำลังส่งภาพ...';
  statusText.textContent = 'กำลังบันทึกภาพลง Google Drive';

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        image: photoData
      })
    });

    statusText.textContent =
      'ส่งคำขอแล้ว กรุณาตรวจสอบภาพใน Google Drive';

    uploadButton.textContent = 'ส่งคำขอแล้ว';

  } catch(error) {
    statusText.textContent =
      'ส่งภาพไม่สำเร็จ กรุณาลองใหม่';

    uploadButton.disabled = false;
    uploadButton.textContent = 'ส่งภาพ';
  }
};

document.getElementById('switchCamera').onclick = async () => {

  cameraMode =
    cameraMode === 'environment'
    ? 'user'
    : 'environment';

  await startCamera();

};
  
startCamera();
</script>
</body>
</html>
